<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@johndoe — LinkForge</title>
    <meta name="description" content="John Doe's link-in-bio page. Creator, Developer, Dreamer.">
    <meta property="og:title" content="@johndoe — LinkForge">
    <meta property="og:description" content="Creator, Developer, Dreamer. Check out my links.">
    <meta property="og:type" content="profile">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#EEF2FF', 100: '#E0E7FF', 200: '#C7D2FE', 300: '#A5B4FC', 400: '#818CF8', 500: '#6366F1', 600: '#4F46E5', 700: '#4338CA', 800: '#3730A3', 900: '#312E81' },
                        accent: { 50: '#FFF7ED', 100: '#FFEDD5', 200: '#FED7AA', 300: '#FDBA74', 400: '#FB923C', 500: '#F97316', 600: '#EA580C', 700: '#C2410C' },
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-up': 'fadeUp 0.5s ease-out forwards',
                        'pulse-ring': 'pulseRing 2s ease-out infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
                        fadeUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pulseRing: { '0%': { transform: 'scale(1)', opacity: '1' }, '100%': { transform: 'scale(1.5)', opacity: '0' } }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #6366F1 0%, #F97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .link-card {
            transition: all 0.2s ease-out;
        }

        .link-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.2);
        }

        .link-card:active {
            transform: scale(0.98);
        }

        .avatar-ring {
            position: relative;
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, #6366F1, #F97316);
            border-radius: 50%;
            z-index: -1;
        }

        .stagger-1 {
            animation-delay: 0.1s;
        }

        .stagger-2 {
            animation-delay: 0.2s;
        }

        .stagger-3 {
            animation-delay: 0.3s;
        }

        .stagger-4 {
            animation-delay: 0.4s;
        }

        .stagger-5 {
            animation-delay: 0.5s;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-50 font-sans min-h-screen">

    <!-- Background Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/3 w-72 h-72 bg-primary-500/10 rounded-full blur-3xl animate-float"></div>
        <div class="absolute bottom-1/3 right-1/4 w-64 h-64 bg-accent-500/10 rounded-full blur-3xl animate-float"
            style="animation-delay: -3s;"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 max-w-md mx-auto px-4 py-12">

        <!-- Profile Header -->
        <header class="text-center mb-10">
            <!-- Avatar with animated ring -->
            <div class="relative inline-block mb-6 opacity-0 animate-fade-up">
                <div class="avatar-ring w-28 h-28 rounded-full overflow-hidden p-1 bg-slate-950">
                    <div
                        class="w-full h-full rounded-full bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center">
                        <span class="text-4xl font-extrabold gradient-text">JD</span>
                    </div>
                </div>
                <!-- Online indicator -->
                <div class="absolute bottom-1 right-1 w-5 h-5 bg-emerald-500 rounded-full border-4 border-slate-950">
                </div>
            </div>

            <!-- Name & Bio -->
            <h1 class="text-2xl font-bold mb-2 opacity-0 animate-fade-up stagger-1">John Doe</h1>
            <p class="text-slate-400 mb-4 opacity-0 animate-fade-up stagger-2">Creator • Developer • Dreamer</p>

            <!-- Social Icons -->
            <div class="flex justify-center gap-3 opacity-0 animate-fade-up stagger-3">
                <a href="#"

                    </svg>

                <a href="#"
                    class="w-10 h-10 rounded-full glass flex items-center justify-center hover:bg-slate-800 transition-colors">

                    </svg>
                </a>
                <a href="#"
                    class="w-10 h-10 rounded-full glass flex items-center justify-center hover:bg-slate-800 transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.162-.105-.949-.199-2.403.041-3.439.219-.937 1.406-5.957 1.406-5.957s-.359-.72-.359-1.781c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 01.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12.017 24c6.624 0 11.99-5.367 11.99-11.988C24.007 5.367 18.641.001 12.017.001z" />
                    </svg>
                </a>
                <a href="#"
                    class="w-10 h-10 rounded-full glass flex items-center justify-center hover:bg-slate-800 transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                    </svg>
                </a>
            </div>
        </header>

        <!-- Links -->
        <nav class="space-y-4">
            <!-- Featured Link (Highlighted) -->
            <a href="#"
                class="link-card block w-full p-5 bg-gradient-to-r from-primary-500 to-primary-600 rounded-2xl text-center opacity-0 animate-fade-up stagger-3 group">
                <div class="flex items-center justify-center gap-3">
                    <span class="text-2xl">✨</span>
                    <span class="font-bold text-lg">My Latest Project</span>
                    <svg class="w-5 h-5 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all"

                    </svg>
                </div>
                <p class="text-primary-100 text-sm mt-1">Just launched! Check it out 🚀</p>
            </a>

            <!-- Regular Links -->
            <a href="#" class="link-card block w-full p-4 glass rounded-2xl opacity-0 animate-fade-up stagger-4 group">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shrink-0">
                        <span class="text-xl">🚀</span>
                    </div>
                    <div class="flex-1 text-left">
                        <span class="font-semibold block">My Portfolio</span>
                        <span class="text-sm text-slate-400">See all my work</span>
                    </div>
                    <svg class="w-5 h-5 text-slate-500 group-hover:text-primary-400 group-hover:translate-x-1 transition-all"

            </a>

            <a href="#" class="link-card block w-full p-4 glass rounded-2xl opacity-0 animate-fade-up stagger-5 group">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center shrink-0">
                        <span class="text-xl">📧</span>
                    </div>
                    <div class="flex-1 text-left">
                        <span class="font-semibold block">Newsletter</span>
                        <span class="text-sm text-slate-400">Weekly insights & tips</span>
                    </div>
                    <svg class="w-5 h-5 text-slate-500 group-hover:text-primary-400 group-hover:translate-x-1 transition-all"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </a>

            <a href="#" class="link-card block w-full p-4 glass rounded-2xl opacity-0 animate-fade-up group"
                style="animation-delay: 0.6s;">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-gradient-to-br from-violet-500 to-violet-600 flex items-center justify-center shrink-0">
                        <span class="text-xl">🎥</span>
                    </div>
                    <div class="flex-1 text-left">
                        <span class="font-semibold block">YouTube Channel</span>
                        <span class="text-sm text-slate-400">Tutorials & vlogs</span>
                    </div>
                    <svg class="w-5 h-5 text-slate-500 group-hover:text-primary-400 group-hover:translate-x-1 transition-all"

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            </a>

            <a href="#" class="link-card block w-full p-4 glass rounded-2xl opacity-0 animate-fade-up group"
                style="animation-delay: 0.7s;">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-orange-500 flex items-center justify-center shrink-0">
                        <span class="text-xl">☕</span>
                    </div>
                    <div class="flex-1 text-left">
                        <span class="font-semibold block">Buy Me a Coffee</span>
                        <span class="text-sm text-slate-400">Support my work</span>
                    </div>
                    <svg class="w-5 h-5 text-slate-500 group-hover:text-primary-400 group-hover:translate-x-1 transition-all"

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>

        <!-- Footer / Branding -->
        <footer class="mt-12 text-center opacity-0 animate-fade-up" style="animation-delay: 0.8s;">
            <a href="/" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-300 transition-colors">
                <svg class="w-5 h-5" viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#6366F1" />
                            <stop offset="100%" style="stop-color:#F97316" />

                    </defs>
                    <circle cx="50" cy="50" r="45" stroke="url(#footGrad)" stroke-width="4" fill="none" />
                    <path d="M30 42 C30 36, 36 30, 44 30 L56 30 C64 30, 70 36, 70 42" stroke="url(#footGrad)"

                        stroke-width="5" stroke-linecap="round" fill="none" />

            </a>
        </footer>
    </main>
</body>

</html>
